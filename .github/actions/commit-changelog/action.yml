name: Commit changelog
description: >-
  Commits and pushes changed changelog file(s) back to main, retrying on push
  races, then asks the docs site to rebuild off the new changelog.

inputs:
  paths:
    description: Paths to `git add` (space-separated)
    required: true
  message:
    description: Commit message
    required: true
  github-token:
    description: >-
      Token used to dispatch the docs rebuild. Needs `actions: write` on the
      calling job — GITHUB_TOKEN is enough.
    required: true

runs:
  using: composite
  steps:
    - name: Commit updated changelog
      shell: bash
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git add ${{ inputs.paths }}
        git commit -m '${{ inputs.message }}'
        # Independent release workflows all push to the same main branch —
        # when several release at once, two jobs can race here. npm publish +
        # the GitHub release already happened by this point, so a failed push
        # must be retried rather than left to fail the job.
        #
        # --autostash: earlier release steps can leave the tree dirty on
        # purpose (e.g. the workspace-range rewrite before `npm publish`,
        # which is never committed back). Without it every rebase — and so
        # every retry — dies with "cannot pull with rebase: You have
        # unstaged changes".
        for attempt in 1 2 3 4 5; do
          if git pull --rebase --autostash origin main && git push origin HEAD:main; then
            exit 0
          fi
          echo "Push attempt $attempt failed, retrying after backoff..."
          sleep "$((RANDOM % 10 + attempt * 3))"
        done
        echo "::error::Failed to push ${{ inputs.paths }} after 5 attempts"
        exit 1

    # The docs site renders its Changelog page straight from these files
    # (apps/docs/src/lib/changelog.ts), and it's a static export — the page
    # only changes when the site is rebuilt. Nothing else will trigger that:
    # the push above is made with GITHUB_TOKEN, and pushes made with
    # GITHUB_TOKEN don't create workflow runs at all, so Deploy Docs' `push`
    # trigger never sees this commit no matter what its path filters say (the
    # `[skip ci]` in the message is belt-and-braces on top of that).
    # workflow_dispatch is the documented exception to that rule, so ask for
    # the rebuild explicitly here — right where the content actually changed,
    # and only when it changed. Without this the page would lag a release by
    # up to 6 hours, until Deploy Docs' scheduled rebuild.
    #
    # Not fatal: by this point npm publish and the GitHub Release have already
    # succeeded, and Deploy Docs' 6-hourly schedule picks the changelog up
    # anyway. Failing the release job over a stale docs page would misreport a
    # release that actually shipped. (`continue-on-error` isn't available on
    # composite-action steps, hence the `||`.)
    - name: Rebuild the docs site
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        GH_REPO: ${{ github.repository }}
      run: >-
        gh workflow run docs.yml --ref main ||
        echo "::warning::Could not dispatch Deploy Docs; the Changelog page will
        catch up on the next scheduled rebuild."
