name: Release prepare
description: >-
  Detects whether a package's version actually changed (vs. what's already on
  npm) and, if so, prepends its changelog and renders release notes.

inputs:
  package-dir:
    description: Path to the package directory (e.g. packages/sdk)
    required: true
  tag-prefix:
    description: Tag prefix for this package (e.g. sdk-v)
    required: true
  tag-pattern:
    description: git-cliff --tag-pattern for this package's tag history
    required: true
  include-path-args:
    description: git-cliff --include-path arguments, space-separated
    required: true
  github-token:
    description: Token used for git-cliff's GitHub API calls
    required: true
  force:
    description: >-
      Treat this as a changed release even if the npm dry-run says otherwise.
      Used to resume a release that failed after npm publish already
      succeeded (see release-mcp.yml's force_publish input).
    required: false
    default: 'false'
  tag-message-file:
    description: >-
      Path to a file whose contents are passed to git-cliff as
      --with-tag-message (available in the template as {{ message }}). Empty
      or missing file means no extra message. See docs/release.md.
    required: false
    default: ''

outputs:
  changed:
    description: Whether this package should be released
    value: ${{ steps.decide.outputs.changed }}
  version:
    description: The version being released
    value: ${{ steps.npm-dry-run.outputs.version }}
  tag:
    description: The full tag name (tag-prefix + version)
    value: ${{ inputs.tag-prefix }}${{ steps.npm-dry-run.outputs.version }}
  notes-path:
    description: Path to the rendered release notes file
    value: /tmp/release-notes.md

runs:
  using: composite
  steps:
    # JS-DevTools/npm-publish no-ops (empty `type` output) when the version
    # in package.json already matches what's on npm. Dry-run first so we
    # only touch the changelog/release for packages that actually changed.
    - name: Check for a version bump
      uses: JS-DevTools/npm-publish@v4
      id: npm-dry-run
      with:
        package: ${{ inputs.package-dir }}/package.json
        dry-run: true

    - name: Decide whether to release
      id: decide
      shell: bash
      run: |
        if [ -n "${{ steps.npm-dry-run.outputs.type }}" ] || [ "${{ inputs.force }}" = "true" ]; then
          echo "changed=true" >> "$GITHUB_OUTPUT"
        else
          echo "changed=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Choose the git-cliff commit range
      # Historically this step hardcoded --latest, which asks git-cliff for
      # "commits since the newest EXISTING tag" — but at this point in the
      # job the tag for the version being released doesn't exist yet (it's
      # created later, by Create GitHub Release), so --latest silently
      # rendered the PREVIOUS release's commits under a --tag-overridden
      # heading that claimed to be the current one. --include-path filtering
      # occasionally hid this (the mislabeled range happened to be empty
      # after filtering, so --latest fell through to the range before it),
      # but the effect was the same: every release described the wrong diff.
      # See docs/adr/0014-git-cliff-unreleased-not-latest.md.
      #
      # --unreleased ("commits not belonging to any tag") is correct for the
      # normal case. The one place --latest is still right is resuming a
      # force_publish release after Create GitHub Release already ran and
      # created the tag: then --unreleased finds nothing (the commits are
      # now tagged), while --latest correctly resolves to that newest,
      # already-created tag.
      id: range
      if: steps.decide.outputs.changed == 'true'
      shell: bash
      run: |
        tag="${{ inputs.tag-prefix }}${{ steps.npm-dry-run.outputs.version }}"
        if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
          echo "mode=--latest" >> "$GITHUB_OUTPUT"
        else
          echo "mode=--unreleased" >> "$GITHUB_OUTPUT"
        fi

    - name: Update package changelog
      if: steps.decide.outputs.changed == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TAG_MESSAGE_FILE: ${{ inputs.tag-message-file }}
      run: |
        set -o pipefail
        extra=()
        if [ -n "$TAG_MESSAGE_FILE" ] && [ -s "$TAG_MESSAGE_FILE" ]; then
          extra+=(--with-tag-message "$(cat "$TAG_MESSAGE_FILE")")
        fi
        cliff=(pnpm exec git-cliff \
          --tag "${{ inputs.tag-prefix }}${{ steps.npm-dry-run.outputs.version }}" \
          --tag-pattern '${{ inputs.tag-pattern }}' \
          --github-repo '${{ github.repository }}' \
          ${{ inputs.include-path-args }} \
          "${extra[@]}" \
          ${{ steps.range.outputs.mode }})
        # A version bump with no commits matching --include-path renders just
        # the "## [tag] - date" heading and nothing else. Prepending that
        # gives readers an empty, misleading entry, so skip it instead.
        if ! "${cliff[@]}" --strip all | grep -q '^- '; then
          echo "::warning::No changelog-worthy commits for this release; leaving ${{ inputs.package-dir }}/CHANGELOG.md untouched."
          exit 0
        fi
        "${cliff[@]}" --prepend '${{ inputs.package-dir }}/CHANGELOG.md'

    - name: Render release notes
      if: steps.decide.outputs.changed == 'true'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TAG_MESSAGE_FILE: ${{ inputs.tag-message-file }}
      run: |
        extra=()
        if [ -n "$TAG_MESSAGE_FILE" ] && [ -s "$TAG_MESSAGE_FILE" ]; then
          extra+=(--with-tag-message "$(cat "$TAG_MESSAGE_FILE")")
        fi
        pnpm exec git-cliff \
          --tag "${{ inputs.tag-prefix }}${{ steps.npm-dry-run.outputs.version }}" \
          --tag-pattern '${{ inputs.tag-pattern }}' \
          --github-repo '${{ github.repository }}' \
          ${{ inputs.include-path-args }} \
          "${extra[@]}" \
          ${{ steps.range.outputs.mode }} --strip all > /tmp/release-notes.md
