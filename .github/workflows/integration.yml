name: Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # mcp resolves `marzban-sdk` as a real package (its package.json
      # `exports` point at dist/), not via source paths — unlike ci.yml,
      # this workflow calls `pnpm --filter` directly instead of going
      # through turbo, so there's no `dependsOn: ["^build"]` to build sdk
      # first automatically. Without this, mcp's test:integration below
      # fails to resolve the `marzban-sdk` import entirely.
      - run: pnpm --filter marzban-sdk build

      - name: Start local Marzban panel
        run: |
          cp local/marzban/.env.example local/marzban/.env
          bash local/marzban/gen-cert.sh
          docker compose -f local/marzban/docker-compose.yml up -d

      - name: Wait for the panel to be ready
        run: |
          # --cacert (not -k): proves the SDK/MCP's httpsAgent-based CA trust
          # actually works against this cert before the test suites — which
          # rely on the same trust, not on skipping verification — even run.
          for i in $(seq 1 30); do
            if curl -s --cacert local/marzban/data/certs/local.crt \
              -o /dev/null -w '%{http_code}' https://127.0.0.1:8000/docs | grep -q 200; then
              echo "Panel is up."
              exit 0
            fi
            sleep 2
          done
          echo "Panel did not become ready in time." >&2
          exit 1

      - run: pnpm --filter marzban-sdk test:integration
      - run: pnpm --filter marzban-mcp test:integration

      - name: Panel logs (on failure)
        if: failure()
        run: docker compose -f local/marzban/docker-compose.yml logs

      - name: Tear down the panel
        if: always()
        run: docker compose -f local/marzban/docker-compose.yml down -v
