name: Publish

on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run — npm publish stays --dry-run, the GitHub Release is created
          as a draft (no real tag), and the changelog is not committed back.
        type: boolean
        default: true

permissions:
  id-token: write # Required for OIDC / npm provenance
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    strategy:
      # Each package publishes independently — one failing/skipped package
      # must not block the others.
      fail-fast: false
      matrix:
        include:
          - dir: packages/sdk
            pkg: marzban-sdk
            tag_prefix: sdk-v
            tag_pattern: '^(sdk-)?v[0-9].*'
            include_path_args: >-
              --include-path 'packages/sdk/**' --include-path 'src/**' --include-path 'openapi/**'
          # marzban-cli is still a private skeleton — add it here once it's
          # ready to publish (drop "private": true first):
          # - dir: packages/cli
          #   pkg: marzban-cli
          #   tag_prefix: cli-v
          #   tag_pattern: '^cli-v.*'
          #   include_path_args: "--include-path 'packages/cli/**'"
          - dir: packages/mcp
            pkg: marzban-mcp
            tag_prefix: mcp-v
            tag_pattern: '^mcp-v.*'
            include_path_args: "--include-path 'packages/mcp/**'"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - run: pnpm turbo run build --filter=${{ matrix.pkg }}

      # JS-DevTools/npm-publish no-ops (empty `type` output) when the version
      # in package.json already matches what's on npm. Dry-run first so we
      # only touch the changelog/release for packages that actually changed.
      - name: Check for a version bump
        uses: JS-DevTools/npm-publish@v4
        id: npm-dry-run
        with:
          package: ${{ matrix.dir }}/package.json
          dry-run: true

      - name: Update package changelog
        if: steps.npm-dry-run.outputs.type != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # --latest (rather than a full regenerate) is required here: git-cliff
          # cannot correctly bucket commits per historical tag once --include-path
          # is applied across the full multi-tag history — it collapses every
          # release into one. Scoped to a single tag boundary, --include-path
          # works correctly, so each release prepends just its own section.
          pnpm exec git-cliff \
            --tag "${{ matrix.tag_prefix }}${{ steps.npm-dry-run.outputs.version }}" \
            --tag-pattern '${{ matrix.tag_pattern }}' \
            --github-repo '${{ github.repository }}' \
            ${{ matrix.include_path_args }} \
            --latest --prepend '${{ matrix.dir }}/CHANGELOG.md'

      - name: Render release notes
        if: steps.npm-dry-run.outputs.type != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec git-cliff \
            --tag "${{ matrix.tag_prefix }}${{ steps.npm-dry-run.outputs.version }}" \
            --tag-pattern '${{ matrix.tag_pattern }}' \
            --github-repo '${{ github.repository }}' \
            ${{ matrix.include_path_args }} \
            --latest --strip all > /tmp/release-notes.md

      - name: Publish to npm
        if: steps.npm-dry-run.outputs.type != ''
        uses: JS-DevTools/npm-publish@v4
        id: npm-publish
        with:
          package: ${{ matrix.dir }}/package.json
          provenance: true
          dry-run: ${{ inputs.dry_run || false }}

      # A draft release is not tied to a real tag in the repo — GitHub only
      # creates the tag when the draft is published — so this is safe to
      # inspect and delete afterwards without leaving anything behind.
      - name: Create GitHub Release
        if: steps.npm-dry-run.outputs.type != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag_prefix }}${{ steps.npm-dry-run.outputs.version }}
          name: ${{ matrix.tag_prefix }}${{ steps.npm-dry-run.outputs.version }}
          body_path: /tmp/release-notes.md
          draft: ${{ inputs.dry_run || false }}

      - name: Commit updated changelog
        if: steps.npm-dry-run.outputs.type != '' && !(inputs.dry_run || false)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add '${{ matrix.dir }}/CHANGELOG.md'
          git commit -m "chore(changelog): ${{ matrix.pkg }} ${{ steps.npm-dry-run.outputs.version }} [skip ci]"
          # Matrix entries publish independently but all push to the same main
          # branch — when several release at once, two jobs can race here.
          # npm publish + the GitHub release already happened by this point, so
          # a failed push must be retried rather than left to fail the job.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed, retrying after backoff..."
            sleep "$((RANDOM % 10 + attempt * 3))"
          done
          echo "::error::Failed to push ${{ matrix.dir }}/CHANGELOG.md after 5 attempts"
          exit 1
