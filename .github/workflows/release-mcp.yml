name: Release mcp

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run — npm publish stays --dry-run, the Docker image is built
          but not pushed, MCP Registry metadata is validated but not published,
          the GitHub Release is created as a draft, and the changelog is not
          committed back.
        type: boolean
        default: true
      force_publish:
        description: >-
          Release even if the dry-run check says the version already matches
          npm. Only needed to resume a release that failed after npm publish
          and/or the Docker push already succeeded — see docs/release.md.
        type: boolean
        default: false

permissions:
  id-token: write # Required for OIDC / npm provenance
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')

    steps:
      # ---------------------------------------------------------------
      # Pre-release
      # ---------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build MCP
        run: pnpm turbo run build --filter=marzban-mcp

      - name: Build downstream notes
        run: node scripts/downstream-notes.mjs mcp > /tmp/downstream-note.md

      - name: Prepare release
        uses: ./.github/actions/release-prepare
        id: prepare
        with:
          package-dir: packages/mcp
          tag-prefix: mcp-v
          tag-pattern: '^mcp-v.*'
          include-path-args: "--include-path 'packages/mcp/**'"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force_publish || false }}
          tag-message-file: /tmp/downstream-note.md

      # ---------------------------------------------------------------
      # Docker
      # ---------------------------------------------------------------

      - name: Set up QEMU
        if: steps.prepare.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.prepare.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: >-
          steps.prepare.outputs.changed == 'true' &&
          !(inputs.dry_run || false)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute minor version
        if: steps.prepare.outputs.changed == 'true'
        id: minor
        run: |
          version='${{ steps.prepare.outputs.version }}'
          echo "value=${version%.*}" >> "$GITHUB_OUTPUT"

      - name: Docker image metadata
        if: steps.prepare.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ilmar7786/marzban-mcp
          tags: |
            type=raw,value=${{ steps.prepare.outputs.version }}
            type=raw,value=${{ steps.minor.outputs.value }}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.prepare.outputs.changed == 'true'
        id: docker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/mcp/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ !(inputs.dry_run || false) }}
          provenance: ${{ !(inputs.dry_run || false) }}
          sbom: ${{ !(inputs.dry_run || false) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---------------------------------------------------------------
      # npm
      # ---------------------------------------------------------------

      - name: Resolve workspace dependency ranges
        if: steps.prepare.outputs.changed == 'true'
        run: node scripts/resolve-workspace-deps.mjs packages/mcp

      - name: Publish to npm
        if: steps.prepare.outputs.changed == 'true'
        uses: JS-DevTools/npm-publish@v4
        with:
          package: packages/mcp/package.json
          provenance: true
          dry-run: ${{ inputs.dry_run || false }}

      # ---------------------------------------------------------------
      # MCP Registry
      # ---------------------------------------------------------------

      - name: Install MCP Publisher
        if: steps.prepare.outputs.changed == 'true'
        run: |
          curl -fsSL \
            "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            -o /tmp/mcp-publisher.tar.gz
          tar -xzf /tmp/mcp-publisher.tar.gz -C /tmp
          install -m 0755 /tmp/mcp-publisher /usr/local/bin/mcp-publisher

      - name: Prepare MCP Registry
        if: steps.prepare.outputs.changed == 'true'
        run: |
          node scripts/prepare-mcp-registry.mjs \
            packages/mcp/server.json \
            "${{ steps.prepare.outputs.version }}"

      - name: Validate MCP Registry
        if: steps.prepare.outputs.changed == 'true'
        working-directory: packages/mcp
        run: mcp-publisher validate

      - name: Authenticate to MCP Registry
        if: >-
          steps.prepare.outputs.changed == 'true' &&
          !(inputs.dry_run || false)
        run: mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        if: >-
          steps.prepare.outputs.changed == 'true' &&
          !(inputs.dry_run || false)
        working-directory: packages/mcp
        run: mcp-publisher publish

      # ---------------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------------

      - name: Add artifact links to release notes
        if: steps.prepare.outputs.changed == 'true'
        run: |
          cat >> "${{ steps.prepare.outputs.notes-path }}" << EOF

          ## Artifacts

          **npm** — [\`marzban-mcp@${{ steps.prepare.outputs.version }}\`](https://www.npmjs.com/package/marzban-mcp/v/${{ steps.prepare.outputs.version }})
          \`npx -y marzban-mcp@${{ steps.prepare.outputs.version }}\`

          **Docker** — [\`ilmar7786/marzban-mcp:${{ steps.prepare.outputs.version }}\`](https://hub.docker.com/r/ilmar7786/marzban-mcp/tags)
          \`docker pull ilmar7786/marzban-mcp:${{ steps.prepare.outputs.version }}\`
          Digest: \`${{ steps.docker.outputs.digest }}\`
          Platforms: \`linux/amd64\`, \`linux/arm64\`

          **MCP Registry** — \`io.github.Ilmar7786/marzban-mcp@${{ steps.prepare.outputs.version }}\`
          EOF

      # A draft release is not tied to a real tag in the repo — GitHub only
      # creates the tag when the draft is published — so this is safe to
      # inspect and delete afterwards without leaving anything behind.
      - name: Create GitHub Release
        if: steps.prepare.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          name: ${{ steps.prepare.outputs.tag }}
          body_path: ${{ steps.prepare.outputs.notes-path }}
          draft: ${{ inputs.dry_run || false }}

      # ---------------------------------------------------------------
      # Changelog
      # ---------------------------------------------------------------

      - name: Clear downstream notes
        if: >-
          steps.prepare.outputs.changed == 'true' &&
          !(inputs.dry_run || false)
        run: node scripts/downstream-notes.mjs mcp --clear

      - name: Commit updated changelog
        if: >-
          steps.prepare.outputs.changed == 'true' &&
          !(inputs.dry_run || false)
        uses: ./.github/actions/commit-changelog
        with:
          paths: packages/mcp/CHANGELOG.md .changelog/mcp-downstream.md
          message: >-
            chore(changelog): marzban-mcp
            ${{ steps.prepare.outputs.version }} [skip ci]
