name: Release sdk

on:
  workflow_run:
    workflows: ['CI']
    branches: [main]
    types:
      - completed
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Dry run — npm publish stays --dry-run, the GitHub Release is created
          as a draft (no real tag), and the changelog is not committed back.
        type: boolean
        default: true
      force_publish:
        description: >-
          Release even if the dry-run check says the version already matches
          npm. Only needed to resume a release that failed after npm publish
          already succeeded.
        type: boolean
        default: false

permissions:
  id-token: write # Required for OIDC / npm provenance
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success')

    steps:
      # ---------------------------------------------------------------
      # Pre-release
      # ---------------------------------------------------------------

      # workflow_run always fires against the default branch's latest workflow
      # file, but its checkout defaults to that same latest commit — not the
      # commit CI actually ran against. main can move between CI finishing and
      # this job starting, so pin explicitly to the commit CI validated. Falls
      # back to github.ref for workflow_dispatch, which has no workflow_run
      # event to read a head_sha from.
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SDK
        run: pnpm turbo run build --filter=marzban-sdk

      - name: Prepare release
        uses: ./.github/actions/release-prepare
        id: prepare
        with:
          package-dir: packages/sdk
          tag-prefix: sdk-v
          tag-pattern: '^(sdk-)?v[0-9].*'
          include-path-args: >-
            --include-path 'packages/sdk/**'
            --include-path 'src/**'
            --include-path 'openapi/**'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          force: ${{ inputs.force_publish || false }}

      # ---------------------------------------------------------------
      # npm
      # ---------------------------------------------------------------

      - name: Publish to npm
        if: steps.prepare.outputs.changed == 'true'
        uses: JS-DevTools/npm-publish@v4
        with:
          package: packages/sdk/package.json
          provenance: true
          dry-run: ${{ inputs.dry_run || false }}

      # ---------------------------------------------------------------
      # GitHub Release
      # ---------------------------------------------------------------

      - name: Add artifact links to release notes
        if: steps.prepare.outputs.changed == 'true'
        run: |
          cat >> ${{ steps.prepare.outputs.notes-path }} << EOF

          ## Artifacts

          **npm** — [\`marzban-sdk@${{ steps.prepare.outputs.version }}\`](https://www.npmjs.com/package/marzban-sdk/v/${{ steps.prepare.outputs.version }})
          \`npm install marzban-sdk@${{ steps.prepare.outputs.version }}\`
          EOF

      # A draft release is not tied to a real tag in the repo — GitHub only
      # creates the tag when the draft is published — so this is safe to
      # inspect and delete afterwards without leaving anything behind.
      - name: Create GitHub Release
        if: steps.prepare.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare.outputs.tag }}
          target_commitish: ${{ github.event.workflow_run.head_sha || github.sha }}
          name: ${{ steps.prepare.outputs.tag }}
          body_path: ${{ steps.prepare.outputs.notes-path }}
          draft: ${{ inputs.dry_run || false }}

      # ---------------------------------------------------------------
      # Changelog
      # ---------------------------------------------------------------

      - name: Commit updated changelog
        if: >-
          steps.prepare.outputs.changed == 'true' &&
          !(inputs.dry_run || false)
        uses: ./.github/actions/commit-changelog
        with:
          paths: packages/sdk/CHANGELOG.md
          message: >-
            chore(changelog): marzban-sdk
            ${{ steps.prepare.outputs.version }} [skip ci]
