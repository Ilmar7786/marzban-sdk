services:
  marzban:
    image: gozargah/marzban:latest
    container_name: marzban-sdk-local
    restart: unless-stopped
    env_file:
      - .env
    # Bridge networking + explicit port mapping, bound to loopback only.
    # Only works because UVICORN_SSL_CERTFILE/KEYFILE are set (see .env,
    # generated by gen-cert.sh): without SSL configured, Marzban hardcodes a
    # bind to 127.0.0.1 *inside the container*, which Docker's port
    # publishing can't reach on any networking mode — see README.md "Ports".
    ports:
      - '127.0.0.1:${MARZBAN_LOCAL_PORT:-8000}:8000'
    volumes:
      - ./data:/var/lib/marzban
